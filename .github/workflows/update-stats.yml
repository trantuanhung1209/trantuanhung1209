name: Update README stats

on:
  schedule:
    - cron: "0 0 * * *" # Tự động cập nhật mỗi ngày lúc 0h
  workflow_dispatch: # Cho phép bấm chạy thủ công

# Thêm phần này để tránh 2 workflow chạy cùng lúc gây xung đột
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&title_color=22D3EE&icon_color=22D3EE&text_color=e0faff&bg_color=0d1117
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&langs_count=6&title_color=22D3EE&text_color=e0faff&bg_color=0d1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          # Thêm 2 dòng dưới đây để đồng bộ code trước khi push
          git pull --rebase origin main
          git push
